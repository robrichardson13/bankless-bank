plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'io.robrichardson.banklessbank.BanklessBankPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:3.12.4'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'io.robrichardson.banklessbank'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('test') {
	// The render harness draws with Graphics2D onto BufferedImages and loads RuneLite's bundled
	// fonts through FontManager. Both work without a display; forcing headless keeps the JVM from
	// trying to attach to one on a developer machine or in CI.
	systemProperty 'java.awt.headless', 'true'
	// Opt-in extra output directory for the render harness's PNGs (they always go to
	// build/screenshots too). Gradle does not forward -D to the test JVM on its own.
	if (System.getProperty('banklessbank.screenshotDir')) {
		systemProperty 'banklessbank.screenshotDir', System.getProperty('banklessbank.screenshotDir')
	}
	testLogging {
		showStandardStreams = false
	}
}

tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Run RuneLite with the plugin loaded (isolated dev environment)'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs = [
		'-ea',
		'--add-exports', 'java.desktop/com.apple.eawt=ALL-UNNAMED',
		'--add-opens', 'java.desktop/com.apple.eawt=ALL-UNNAMED',
		'--add-opens', 'java.desktop/sun.awt=ALL-UNNAMED',
		'--add-opens', 'java.desktop/java.awt=ALL-UNNAMED'
	]
	args = [
		'--developer-mode',
		'--debug',
		'--profile=dev',
		'--sessionfile=dev-session.properties'
	]
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
